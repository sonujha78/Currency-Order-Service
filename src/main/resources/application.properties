# ===== App Info =====
quarkus.application.name=currency-order-service

# ===== HTTP =====
quarkus.http.port=8080

# ===== Datasource (PostgreSQL) =====
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=orders_user
quarkus.datasource.password=orders_pass
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/orders_db

# ===== Hibernate ORM =====
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# ===== REST Client - Exchange Rate API =====
quarkus.rest-client.exchange-rate-api.url=https://open.er-api.com
quarkus.rest-client.exchange-rate-api.scope=jakarta.inject.Singleton

# ===== Kafka =====
kafka.bootstrap.servers=localhost:9092

mp.messaging.outgoing.order-created-out.connector=smallrye-kafka
mp.messaging.outgoing.order-created-out.topic=order-created
mp.messaging.outgoing.order-created-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.incoming.order-created-in.connector=smallrye-kafka
mp.messaging.incoming.order-created-in.topic=order-created
mp.messaging.incoming.order-created-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.order-created-in.auto.offset.reset=earliest
mp.messaging.incoming.order-created-in.group.id=order-indexer-group

# ===== OpenSearch (custom config, we'll read via ConfigProperty) =====
opensearch.host=localhost
opensearch.port=9200
opensearch.index=orders

# ===== Logging =====
quarkus.log.level=INFO
quarkus.log.category."com.orders".level=DEBUG
